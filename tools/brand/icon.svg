    <path d="M14 20a20 20 0 0 1 14-10" stroke="#ffffff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" fill="none"/>
    <rect x="0" y="28.5" width="64" height="7" fill="#000"/>
