<!doctype html>
<!-- Open Graph card, 1200x630, in the title screen's style. Rendered to og.png by render.mjs. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; background: #ffdb33; overflow: hidden; display: grid; grid-template-columns: 1fr 380px; gap: 40px; align-items: center; padding: 0 80px 0 64px; }
  .rays { position: absolute; left: 34%; top: 50%; width: 3000px; height: 3000px; translate: -50% -50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.32) 0deg 9deg, transparent 9deg 18deg); }
  .dots { position: absolute; inset: 0; background: radial-gradient(rgba(0,0,0,0.16) 1.4px, transparent 1.8px) 0 0 / 22px 22px; }
  .left, .right { position: relative; z-index: 1; }
  .logo { display: flex; flex-direction: column; align-items: flex-start; line-height: 0.9; rotate: -4deg; }
  .logo span { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; }
  .big { font-size: 96px; color: #fff; -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 9px 9px 0 #000; }
  .big.red { color: #e63946; }
  .of { font-size: 30px; background: #000; color: #ffdb33; padding: 4px 16px 6px; margin: 8px 0 10px 8px; rotate: 4deg; }
  .tag { margin-top: 38px; display: inline-block; background: #000; color: #fff; font-size: 27px; line-height: 1.3; padding: 12px 20px 14px; box-shadow: 8px 8px 0 #e63946; }
  .dex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: #fff; border: 5px solid #000; box-shadow: 12px 12px 0 #000; padding: 18px; }
  .mon { aspect-ratio: 1; background: #fae583; border: 3px solid #000; display: grid; place-items: center; overflow: hidden; }
  .mon img { width: 125%; height: 125%; object-fit: contain; image-rendering: pixelated; }
  .ball { position: absolute; right: -40px; top: -58px; width: 116px; height: 116px; border-radius: 50%; border: 7px solid #000; box-shadow: 9px 9px 0 #000;
    background: radial-gradient(circle, #fff 0 13%, #000 13% 21%, transparent 21%), linear-gradient(#e63946 0 45%, #000 45% 55%, #fff 55%); rotate: 14deg; }
</style></head>
<body><div class="card">
  <div class="rays"></div><div class="dots"></div>
  <div class="left">
    <div class="logo"><span class="big red">Clash</span><span class="of">of</span><span class="big">Pokémons</span></div>
    <div class="tag">Clash Royale–style Pokémon battles,<br>live in your browser</div>
  </div>
  <div class="right">
    <div class="dex" id="dex"></div>
    <div class="ball"></div>
  </div>
</div>
<script>
  // Gen III sprites from the PokeAPI sprites repo, as on the loading screen.
  const dex = [25, 6, 94, 143, 1, 7];
  const host = document.getElementById('dex');
  for (const n of dex) {
    const d = document.createElement('div');
    d.className = 'mon';
    const img = new Image();
    img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iii/emerald/${n}.png`;
    img.onerror = () => { throw new Error(`OG sprite ${n} failed to load`); };
    d.append(img);
    host.append(d);
  }
</script></body></html>
