# Deploys the game server to its EC2 instance whenever server code lands on main:
# tests first, then update.sh on the instance via SSM (no SSH), then a live smoke test.
# AWS access is OIDC (no stored keys), trusted for this repo's main branch only.
# Repo variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN, SERVER_INSTANCE_ID, SERVER_URL.
name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/shared/**
      - deploy/aws/**
      - supabase/**
      - package.json
      - pnpm-lock.yaml
      - .npmrc
      - .dockerignore
      - .github/workflows/deploy-server.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time; a newer push waits for the running one rather than cancelling it.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cop/shared --filter @cop/server typecheck
      - run: pnpm --filter @cop/shared --filter @cop/server test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run update.sh on the instance
        env:
          INSTANCE: ${{ vars.SERVER_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":[\"/opt/cop/deploy/aws/update.sh $GITHUB_SHA\"],\"executionTimeout\":[\"1800\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command $CMD"

          # Poll until it finishes (builds take a few minutes). The invocation can take a moment
          # to exist after sending; any other error is real and fails the job.
          STATUS=Pending
          for _ in $(seq 1 120); do
            if OUT=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query Status --output text 2>&1); then
              STATUS=$OUT
            elif [[ "$OUT" != *InvocationDoesNotExist* ]]; then
              echo "$OUT" >&2
              exit 1
            fi
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "::group::Instance output"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query StandardOutputContent --output text
          echo "::endgroup::"
          ERR=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query StandardErrorContent --output text)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "::group::Instance errors"
            echo "$ERR"
            echo "::endgroup::"
          fi
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy ended with status $STATUS"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke test the live server
        run: pnpm smoke "${{ vars.SERVER_URL }}"
